<nav>

        <img id="text" src="/assets/RibbitText.png" alt="Ribbit">   
    </div>
    @if (!isLogged) {
        <div class="button-row">
            <app-custom-button variant="white" label="LOGIN" routerLink="/"></app-custom-button>

        </div>
    } @else {
        <div class="menu-row">
            <a routerLink="/">Página Inicial</a>
            <a routerLink="/">
                <img src="/assets/GenericAvatar.png" alt="Perfil">
            </a>
        </div>
    }
</nav>
