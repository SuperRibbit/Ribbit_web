<nav [class.menu-open]="showMobileMenu()">
    <a class="logo" routerLink="/" aria-label="Ribbit - Página inicial">
        <img id="logo" src="/assets/RibbitLogo.png" alt="Logo do Mascote Ribbit">
        <img id="text" src="/assets/RibbitText.png" alt="Ribbit">
    </a>

    @if (showPublic) {
    <button
        type="button"
        class="menu-toggle"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="showMobileMenu() ? 'true' : 'false'"
        aria-controls="navbar-menu"
        [attr.aria-label]="showMobileMenu() ? 'Fechar menu' : 'Abrir menu'">
        <i class="ph" [class.ph-list]="!showMobileMenu()" [class.ph-x]="showMobileMenu()" aria-hidden="true"></i>
    </button>

    <div class="button-row" id="navbar-menu">
        <app-custom-button variant="white" label="LOGIN" routerLink="/login" (click)="closeMobileMenu()"></app-custom-button>
        <app-custom-button variant="green" label="CADASTRO" routerLink="/logon" (click)="closeMobileMenu()"></app-custom-button>
    </div>
    } @else {
    @if (isAdmin()) {
    <div class="menu-row" id="navbar-menu">
        <div class="menu-links">
            <div class="admin-dropdown">
                <button
                    type="button"
                    class="nav-link-admin admin-dropdown-toggle"
                    (click)="toggleAdminMenu()"
                    [attr.aria-expanded]="showAdminMenu() ? 'true' : 'false'"
                    aria-haspopup="menu"
                    aria-controls="admin-dropdown-menu">
                    Gerenciar <i class="ph" [class.ph-caret-up]="showAdminMenu()" [class.ph-caret-down]="!showAdminMenu()" aria-hidden="true"></i>
                </button>
                @if (showAdminMenu()) {
                <div class="admin-dropdown-menu" id="admin-dropdown-menu" role="menu">
                    <a role="menuitem" routerLink="/admin/courses" (click)="closeAdminMenu(); closeMobileMenu()">Gerenciar Cursos</a>
                    <a role="menuitem" routerLink="/admin/users" (click)="closeAdminMenu(); closeMobileMenu()">Gerenciar Usuários</a>
                </div>
                }
            </div>
        </div>
    </div>
    }

    <div class="nav-actions">
        <a routerLink="/profile" class="profile-link" aria-label="Perfil" (click)="closeMobileMenu()">
            <img [src]="avatarUrl()" (error)="avatarUrl.set('assets/GenericAvatar.png')" alt="Perfil" class="navbar-avatar">
        </a>

        @if (isAdmin()) {
        <button
            type="button"
            class="menu-toggle"
            (click)="toggleMobileMenu()"
            [attr.aria-expanded]="showMobileMenu() ? 'true' : 'false'"
            aria-controls="navbar-menu"
            [attr.aria-label]="showMobileMenu() ? 'Fechar menu' : 'Abrir menu'">
            <i class="ph" [class.ph-list]="!showMobileMenu()" [class.ph-x]="showMobileMenu()" aria-hidden="true"></i>
        </button>
        }
    </div>
    }
</nav>
