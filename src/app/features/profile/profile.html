<div class="perfil-container">
    <div class="perfil-card">
        <form #formulario="ngForm" (ngSubmit)="onSubmit(formulario)" novalidate>
            <header class="perfil">
                <div class="perfil-left">
                    <img [src]="userData.avatar_url" alt="Avatar">
                </div>

                <div class="perfil-right">
                    <h3>Meu Perfil</h3>
                </div>
            </header>

            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required minlength="10" [(ngModel)]="userData.nome"
                    [disabled]="!isEditing()" placeholder="Digite seu nome...">
                <small class="erro"
                    [hidden]="!(formulario.controls['nome']?.dirty && formulario.controls['nome'].invalid)">
                    Informe um nome válido.
                </small>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required minlength="10" [(ngModel)]="userData.email"
                    [disabled]="!isEditing()" placeholder="Digite seu e-mail...">
                <small class="erro"
                    [hidden]="!(formulario.controls['email']?.dirty && formulario.controls['email'].invalid)">
                    Informe um e-mail válido.
                </small>
            </div>

            @if (isEditing()) {
            <div class="senha-group">
                <div class="campo">
                    <label for="senha">Nova Senha:</label>
                    <input type="password" id="senha" name="senha" required minlength="6" [(ngModel)]="userData.senha"
                        placeholder="Digite uma nova senha...">
                </div>

                <div class="campo">
                    <label for="confirmacaoSenha">Confirme a senha:</label>
                    <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" required minlength="6"
                        [(ngModel)]="userData.confirmacaoSenha" placeholder="Repita sua nova senha...">
                </div>
            </div>
            }

            @if (mensagem()) {
            <p class="mensagem">{{ mensagem() }}</p>
            }

            <div class="confirmar">
                @if (isEditing()) {
                <app-custom-button variant="blue" [label]="enviando() ? 'Salvando...' : 'Confirmar Alterações'"
                    [disabled]="enviando()"></app-custom-button>
                }
            </div>
        </form>

        <div class="confirmar">
            @if (!isEditing()) {
            <app-custom-button variant="blue" label="Editar Perfil" (click)="toggleEdit()"></app-custom-button>
            } @else {
            <app-custom-button variant="white" label="Cancelar" (click)="toggleEdit()"
                [disabled]="enviando()"></app-custom-button>
            }
        </div>
    </div>


    <div class="cursos-section">
        <div class="cursos-header">
            <h2>Meus Cursos</h2>
            <app-custom-button variant="green" label="Cadastrar novo curso"></app-custom-button>
        </div>

        <div class="cursos-grid">
            <app-card-curso-home></app-card-curso-home>
            <app-card-curso-home></app-card-curso-home>
            <app-card-curso-home></app-card-curso-home>
        </div>
    </div>
</div>
