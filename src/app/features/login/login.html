<div class="login-container">

    <div class="login-left">
        <img src="/assets/RibbitLogo.png" alt="Logo Ribbit" style="margin-bottom: 12px; max-width: 200px;">
        <img src="/assets/RibbitText.png" alt="Ribbit">
        <img src="/assets/IconsRibbit.png" alt="">
    </div>

    <div class="login-right">
        <form #formulario="ngForm" (ngSubmit)="onSubmit(formulario)" novalidate>

            <h2>Entre em sua conta</h2>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" [(ngModel)]="userLogin.email" required minlength="10"
                    placeholder="Digite seu e-mail...">

                <small class="erro"
                    [hidden]="!(formulario.controls['email']?.dirty && formulario.controls['email'].invalid)">
                    Informe um e-mail válido.
                </small>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" [(ngModel)]="userLogin.senha" required minlength="6"
                    placeholder="Digite sua senha...">

                <small class="erro"
                    [hidden]="!(formulario.controls['senha']?.dirty && formulario.controls['senha'].invalid)">
                    A senha deve ter ao menos 6 caracteres.
                </small>
            </div>

            @if (mensagem()) {
            <p class="mensagem">{{ mensagem() }}</p>
            }

            <a href="">Esqueceu sua senha?</a>


            <div class="button">
                <app-custom-button variant="blue" label="Entrar"></app-custom-button>
            </div>

            <p>Ainda não possui uma conta? <a href="">Cadastre-se</a></p>
        </form>
    </div>
</div>
