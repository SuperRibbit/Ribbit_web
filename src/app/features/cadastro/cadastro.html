
<div class="login-container">

    <div class="login-left">
        <img src="/assets/RibbitLogo.png" alt="Logo Ribbit" style="margin-bottom: 12px; max-width: 200px;">
        <img src="/assets/RibbitText.png" alt="Ribbit">
        <img src="/assets/IconsRibbit.png" alt="">
    </div>

    <div class="login-right">
        <form #formulario="ngForm" (ngSubmit)="onSubmit(formulario)" novalidate>

            <h2>Crie sua conta</h2>
            <h3>É grátis, simples e rápido</h3>

            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="nome" id="nome" name="nome" required minlength="10"
                    placeholder="Digite seu nome...">

                <small class="erro"
                    [hidden]="!(formulario.controls['nome']?.dirty && formulario.controls['nome'].invalid)">
                    Informe um nome válido.
                </small>
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required minlength="10"
                    placeholder="Digite seu e-mail...">

                <small class="erro"
                    [hidden]="!(formulario.controls['email']?.dirty && formulario.controls['email'].invalid)">
                    Informe um e-mail válido.
                </small>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required minlength="6"
                    placeholder="Digite sua senha...">

                <small class="erro"
                    [hidden]="!(formulario.controls['senha']?.dirty && formulario.controls['senha'].invalid)">
                    A senha deve ter ao menos 6 caracteres.
                </small>
            </div>

            <div class="campo">
                <label for="senha">Confirme a senha:</label>
                <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" required minlength="6"
                    placeholder="Repita sua senha...">

                <small class="erro"
                    [hidden]="!(formulario.controls['senha']?.dirty && formulario.controls['senha'].invalid)">
                    A senha deve ter ao menos 6 caracteres.
                </small>
            </div>

            @if (mensagem()) {
            <p class="mensagem">{{ mensagem() }}</p>
            }


            <div class="button">
                <app-custom-button variant="blue" label="Continuar"></app-custom-button>
            </div>

            <p>Já possui uma conta? <a href="">Faça login</a></p>
        </form>
    </div>
</div>
