<div class="container">
    
    <section class="home-section recent-activities">
        <div class="section-header">
            <h2>Atividades Recentes</h2>
        </div>
        <div class="activities-grid">
            <app-card-curso-dashboard 
                [progress]="75" 
                description="Scratch: introdução a programação de forma gamificada">
            </app-card-curso-dashboard>
            <app-card-curso-dashboard 
                [progress]="35" 
                description="Javascript, Html e Css">
            </app-card-curso-dashboard>
        </div>
    </section>

    <section class="home-section catalog-section">
        <div class="section-header">
            <h2>Nosso Catálogo</h2>
        </div>
        <div class="cursos-grid">
            @for (item of listaCursos(); track item.course_id) {
                <app-card-curso-home [curso]="item"></app-card-curso-home>
            } @empty {
                <p class="carregando-aviso">Buscando o catálogo de cursos do Ribbit...</p>
            }
        </div>
    </section>
</div>
<app-footer variant="green"></app-footer>
