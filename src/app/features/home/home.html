<div class="container">
    
    <section class="home-section recent-activities">
        <div class="section-header">
            <h2>Atividades Recentes</h2>
        </div>
        <div class="activities-grid">
            @for (item of listaAtividadesRecentes(); track item.enrollment_id) {
                <app-card-curso-dashboard 
                    [progress]="item.progress" 
                    [description]="item.course.title"
                    [imageUrl]="item.course.banner_url || 'assets/imageScratch.png'"
                    [courseId]="item.course.id || item.course.course_id">
                </app-card-curso-dashboard>
            } @empty {
                <p>Você ainda não iniciou nenhum curso.</p>
            }
        </div>
    </section>

    <section class="home-section catalog-section">
        <div class="section-header">
            <h2>Nosso Catálogo</h2>
        </div>

        <div class="search-input-wrapper">
            <i class="ph ph-magnifying-glass search-icon"></i>
            <input
                type="text"
                placeholder="Buscar por título, instrutor ou slug..."
                [ngModel]="searchTerm()"
                (ngModelChange)="onSearchTermChange($event)"
                class="search-input"
            />
        </div>

        <div class="cursos-grid">
            @for (item of listaCursosPaginada(); track item.course_id) {
                <app-card-curso-home [curso]="item"></app-card-curso-home>
            } @empty {
                <p class="carregando-aviso">Nenhum curso encontrado.</p>
            }
        </div>

        <app-pagination
            [page]="catalogoPage()"
            [totalPages]="totalCatalogoPages()"
            (pageChange)="onCatalogoPageChange($event)">
        </app-pagination>
    </section>
</div>
<app-footer variant="green"></app-footer>
