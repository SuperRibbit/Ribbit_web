<div class="container">
    <div class="card">
        <h2>Redefinir senha</h2>
        <p>
            Digite seu e-mail para receber o link de redefinição de senha.
        </p>

        <form [formGroup]="mailForm" (ngSubmit)="onSubmit()">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" formControlName="email">

                @if(mailForm.get('email')?.touched &&
                    mailForm.get('email')?.invalid) {

                    <small>Email inválido</small>
                }
            </div>

            @if(successMessage) {
                <div class="success-message">
                    {{ successMessage }}
                </div>
            }

            @if(errorMessage) {
                <div class="error-message">
                    {{ errorMessage }}
                </div>
            }

            <app-custom-button variant="blue" label="Enviar"/>
        </form>
    </div>
</div>
