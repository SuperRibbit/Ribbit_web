<div class="perfil-container">

    <header class="header">
        <div class="header-left">
            <img src="assets/logoHorizontal.png" alt="Logo">
            <h3><a href="">Página Inicial</a></h3>
        </div>
        <div class="header-right">
            <img src="assets/GenericAvatar.png" alt="Avatar">
        </div>
    </header>

    <div class="perfil-card">
        <form #formulario="ngForm" (ngSubmit)="onSubmit(formulario)" novalidate>
            <div class="perfil-prof">
                <div class="perfil-left">
                    <img src="assets/GenericAvatar.png" alt="Avatar">
                    <app-custom-button variant="blue" label="Trocar avatar"></app-custom-button>
                </div>

                <div class="perfil-right">
                    <h3>Perfil do Professor</h3>
                </div>
            </div>

            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" [(ngModel)]="userPerfil.nome" required minlength="10"
                    placeholder="Digite um novo nome...">
                <small class="erro"
                    [hidden]="!(formulario.controls['nome']?.dirty && formulario.controls['nome'].invalid)">
                    Informe um nome válido.
                </small>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" [(ngModel)]="userPerfil.email" required minlength="10"
                    placeholder="Digite um novo e-mail...">
                <small class="erro"
                    [hidden]="!(formulario.controls['email']?.dirty && formulario.controls['email'].invalid)">
                    Informe um e-mail válido.
                </small>
            </div>

            <div class="senha-group">
                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" [(ngModel)]="userPerfil.senha" required minlength="6"
                        placeholder="Digite uma nova senha...">
                    <small class="erro"
                        [hidden]="!(formulario.controls['senha']?.dirty && formulario.controls['senha'].invalid)">
                        A senha deve ter ao menos 6 caracteres.
                    </small>
                </div>

                <div class="campo">
                    <label for="confirmacaoSenha">Confirme a senha:</label>
                    <input type="password" id="confirmacaoSenha" name="confirmacaoSenha"
                        [(ngModel)]="userPerfil.confirmacaoSenha" required minlength="6"
                        placeholder="Repita sua nova senha...">
                    <small class="erro"
                        [hidden]="!(formulario.controls['confirmacaoSenha']?.dirty && formulario.controls['confirmacaoSenha'].invalid)">
                        A senha deve ter ao menos 6 caracteres.
                    </small>
                </div>
            </div>

            @if (mensagem()) {
            <p class="mensagem">{{ mensagem() }}</p>
            }

            <div class="confirmar">
                <app-custom-button variant="blue" label="Confirmar alterações"></app-custom-button>
            </div>
        </form>
    </div>


    <div class="cursos-section">
        <div class="cursos-header">
            <h2>Meus Cursos</h2>
            <app-custom-button variant="green" label="Cadastrar novo curso"></app-custom-button>
        </div>

        <div class="cursos-grid">
            <app-card-curso-home></app-card-curso-home>
            <app-card-curso-home></app-card-curso-home>
            <app-card-curso-home></app-card-curso-home>
        </div>
    </div>
</div>
