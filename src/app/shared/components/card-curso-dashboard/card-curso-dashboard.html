<section class="container">
    <div class="card-image-area">
        @if (imageUrl && !imgError) {
            <img [src]="imageUrl | driveImg" [alt]="description" class="card-image" (error)="imgError = true">
        } @else {
            <div class="card-placeholder" aria-hidden="true">
                <i class="fa-solid fa-laptop-code"></i>
            </div>
        }
    </div>

    <div class="progress-container">
        <div class="progress-header">
            <span class="progress-text">{{ progress }}% concluído</span>
        </div>
        
        <div class="progress-bar-track">
            <div class="progress-bar-fill" [style.width.%]="progress"></div>
        </div>
    </div>

    <div class="card-text-area">
        <p class="card-description">{{ description }}</p>
    </div>

    <app-custom-button variant="blue" label="RETOMAR" (click)="retomarCurso()"></app-custom-button>
</section>
