<section class="card-container" (click)="goToCourse()">
    <div class="card-image-area">
        <img [src]="curso?.banner_url || 'assets/imageScratch.png'" [alt]="curso?.title" class="card-image">
    </div>

    <div class="card-text-area">
        <h3 class="card-titulo">{{ curso?.title }}</h3>
        
        <p class="card-description">{{ curso?.description }}</p>
    </div>
</section>
