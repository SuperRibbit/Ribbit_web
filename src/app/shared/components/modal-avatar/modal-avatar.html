<div class="modal-overlay" (click)="onOverlayClick($event)">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Escolha um avatar</h3>
            <button class="btn-close" type="button" (click)="fecharModal()">&times;</button>
        </div>

        <div class="avatar-grid">
            @for (avatar of avatares; track avatar) {
                <div class="avatar-item" [class.selecionado]="selecionado() === avatar" (click)="selecionarAvatar(avatar)">
                    <img [src]="avatar" alt="Opção de avatar">
                </div>
            }
        </div>

        <div class="modal-footer">
            <app-custom-button variant="blue" label="Confirmar" (click)="confirmarSelecao()"></app-custom-button>
            <app-custom-button variant="red" label="Cancelar" (click)="fecharModal()"></app-custom-button>
        </div>
    </div>
</div>
